[project]
name = "credit-score-app"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.0",
  "scikit-learn==1.5.2",
  "shap==0.46.0",
  "pandas==2.2.3",
  "numpy==2.1.3",
  "polars==1.9.0",
  "joblib==1.4.2",
  "slowapi==0.1.9",
  "uvicorn==0.30.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
